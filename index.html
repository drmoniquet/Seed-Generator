<script type="module">
import * as THREE from "three";

import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";

const CONFIG = {
  fogColor: 460810,
  fogDensity: .032,
  waterColor: 857362,
  waterSize: 200,
  waterSegments: 140,
  waveHeight: .06,
  waveSpeed: .35,
  pathLength: 9,
  pathWidth: 1.4,
  plankDepth: .5,
  plankGap: .06,
  pathY: .02,
  screenWidth: 10.8,
  screenHeight: 4.05,
  screenDistance: 8,
  screenSpread: 6.6,
  screenHeightAbove: 3,
  screenAngle: Math.PI / 7.5,
  eyeHeight: 1.65,
  walkSpeed: 3.4,
  boundsRadius: 18
};

const scene = new THREE.Scene;

scene.fog = new THREE.FogExp2(CONFIG.fogColor, CONFIG.fogDensity);

scene.background = new THREE.Color(CONFIG.fogColor);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, .1, 200);

camera.position.set(0, CONFIG.eyeHeight, 2.5);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

renderer.setSize(window.innerWidth, window.innerHeight);

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function makeStarfield() {
  const STAR_COUNT = 5e3;
  const BAND_STAR_COUNT = 2200;
  const radius = 170;
  const positions = new Float32Array((STAR_COUNT + BAND_STAR_COUNT) * 3);
  const colors = new Float32Array((STAR_COUNT + BAND_STAR_COUNT) * 3);
  const sizes = new Float32Array(STAR_COUNT + BAND_STAR_COUNT);
  const tint = new THREE.Color;
  for (let i = 0; i < STAR_COUNT; i++) {
    const u = Math.random();
    const v = Math.random();
    const theta = 2 * Math.PI * u;
    const phi = Math.acos(2 * v - 1);
    const x = radius * Math.sin(phi) * Math.cos(theta);
    const y = radius * Math.cos(phi);
    const z = radius * Math.sin(phi) * Math.sin(theta);
    positions[i * 3] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;
    const warmth = Math.random();
    tint.setRGB(.82 + warmth * .18, .85 + warmth * .12, .95);
    const brightness = .5 + Math.random() * .5;
    colors[i * 3] = tint.r * brightness;
    colors[i * 3 + 1] = tint.g * brightness;
    colors[i * 3 + 2] = tint.b * brightness;
    sizes[i] = .5 + Math.random() * 1.3;
  }
  const bandAxis = new THREE.Vector3(.3, .55, -.78).normalize();
  const bandUp = new THREE.Vector3(0, 1, 0);
  const bandRight = (new THREE.Vector3).crossVectors(bandAxis, bandUp).normalize();
  const bandUp2 = (new THREE.Vector3).crossVectors(bandRight, bandAxis).normalize();
  for (let i = 0; i < BAND_STAR_COUNT; i++) {
    const along = (Math.random() - .5) * Math.PI * 1.7;
    const spread = (Math.random() - .5) * .55 * Math.exp(-Math.abs(Math.random() * 2 - 1));
    const dir = (new THREE.Vector3).copy(bandAxis).multiplyScalar(Math.cos(along)).addScaledVector(bandRight, Math.sin(along)).addScaledVector(bandUp2, spread).normalize();
    const idx = STAR_COUNT + i;
    positions[idx * 3] = dir.x * radius;
    positions[idx * 3 + 1] = dir.y * radius;
    positions[idx * 3 + 2] = dir.z * radius;
    const brightness = .35 + Math.random() * .4;
    colors[idx * 3] = .85 * brightness;
    colors[idx * 3 + 1] = .88 * brightness;
    colors[idx * 3 + 2] = .95 * brightness;
    sizes[idx] = .35 + Math.random() * .8;
  }
  const geo = new THREE.BufferGeometry;
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  geo.setAttribute("size", new THREE.BufferAttribute(sizes, 1));
  const mat = new THREE.PointsMaterial({
    size: 1.1,
    vertexColors: true,
    transparent: true,
    opacity: .9,
    depthWrite: false,
    sizeAttenuation: false,
    fog: false
  });
  return new THREE.Points(geo, mat);
}

scene.add(makeStarfield());

scene.add(new THREE.AmbientLight(4871496, 2.3));

const moonLight = new THREE.DirectionalLight(13159352, 1.4);

moonLight.position.set(-18, 34, -22);

scene.add(moonLight);

const fill = new THREE.HemisphereLight(6054480, 1843224, 1.05);

scene.add(fill);

const moonGroup = new THREE.Group;

const moonTexture = (new THREE.TextureLoader).load("images/moon-photo.png");

moonTexture.colorSpace = THREE.SRGBColorSpace;

const moonBody = new THREE.Sprite(new THREE.SpriteMaterial({
  map: moonTexture,
  transparent: true,
  fog: false
}));

moonBody.scale.set(12, 12, 1);

moonGroup.add(moonBody);

moonGroup.position.copy(moonLight.position).multiplyScalar(3.2);

scene.add(moonGroup);

const waterGeo = new THREE.PlaneGeometry(CONFIG.waterSize, CONFIG.waterSize, CONFIG.waterSegments, CONFIG.waterSegments);

waterGeo.rotateX(-Math.PI / 2);

function makeEnvFaceCanvas(kind) {
  const size = 128;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  if (kind === "top") {
    ctx.fillStyle = "#0a1016";
    ctx.fillRect(0, 0, size, size);
  } else if (kind === "bottom") {
    ctx.fillStyle = "#030405";
    ctx.fillRect(0, 0, size, size);
  } else {
    const grad = ctx.createLinearGradient(0, 0, 0, size);
    grad.addColorStop(0, "#0a1016");
    grad.addColorStop(.72, "#141d24");
    grad.addColorStop(1, "#2a3a42");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
  }
  return canvas;
}

const envCube = new THREE.CubeTexture([ makeEnvFaceCanvas("side"), makeEnvFaceCanvas("side"), makeEnvFaceCanvas("top"), makeEnvFaceCanvas("bottom"), makeEnvFaceCanvas("side"), makeEnvFaceCanvas("side") ]);

envCube.needsUpdate = true;

envCube.colorSpace = THREE.SRGBColorSpace;

function makeGrassTexture() {
  const size = 256;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#232c1c";
  ctx.fillRect(0, 0, size, size);
  const bladeCount = 2200;
  for (let i = 0; i < bladeCount; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const len = 3 + Math.random() * 7;
    const angle = (Math.random() - .5) * .9 - Math.PI / 2;
    const warmth = Math.random();
    const g = Math.round(70 + warmth * 50 + Math.random() * 20);
    const r = Math.round(g * (.45 + warmth * .15));
    const b = Math.round(g * .35);
    ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${.35 + Math.random() * .4})`;
    ctx.lineWidth = .8 + Math.random() * 1.1;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

const grassTexture = makeGrassTexture();

const waterMat = new THREE.MeshStandardMaterial({
  color: CONFIG.waterColor,
  roughness: .18,
  metalness: .25,
  envMap: envCube,
  envMapIntensity: .9
});

let waterShaderRef = null;

waterMat.onBeforeCompile = shader => {
  shader.uniforms.uTime = {
    value: 0
  };
  shader.uniforms.uGrassMap = {
    value: grassTexture
  };
  shader.vertexShader = shader.vertexShader.replace("#include <common>", `#include <common>\n      uniform float uTime;\n      varying vec3 vWaterWorldPos;\n      varying float vShoreMix;\n\n      float waveHeight(vec2 p, float t) {\n        float h = 0.0;\n        h += sin(p.x * 0.35 + t * 0.35) * 0.06;\n        h += cos(p.y * 0.28 + t * 0.28) * 0.06;\n        h += sin((p.x * 0.9 + p.y * 0.6) + t * 0.6) * 0.028;\n        h += cos((p.x * 0.5 - p.y * 0.8) + t * 0.45) * 0.022;\n        h += sin((p.x * 1.7 - p.y * 1.3) + t * 1.1) * 0.01;\n        return h;\n      }`).replace("#include <beginnormal_vertex>", `#include <beginnormal_vertex>\n      {\n        float eps = 0.15;\n        float shoreFade = 1.0 - smoothstep(14.0, 30.0, length(position.xz));\n        float hL = waveHeight(position.xz - vec2(eps, 0.0), uTime) * shoreFade;\n        float hR = waveHeight(position.xz + vec2(eps, 0.0), uTime) * shoreFade;\n        float hD = waveHeight(position.xz - vec2(0.0, eps), uTime) * shoreFade;\n        float hU = waveHeight(position.xz + vec2(0.0, eps), uTime) * shoreFade;\n        objectNormal = normalize(vec3((hL - hR) / (2.0 * eps), 1.0, (hD - hU) / (2.0 * eps)));\n      }`).replace("#include <begin_vertex>", `#include <begin_vertex>\n      float distFromCenter = length(position.xz);\n      float shoreFade = 1.0 - smoothstep(14.0, 30.0, distFromCenter);\n      transformed.y += waveHeight(position.xz, uTime) * shoreFade;\n      vWaterWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;\n      vShoreMix = smoothstep(12.0, 28.0, distFromCenter);`);
  shader.fragmentShader = shader.fragmentShader.replace("#include <common>", `#include <common>\n      uniform sampler2D uGrassMap;\n      varying vec3 vWaterWorldPos;\n      varying float vShoreMix;`).replace("#include <dithering_fragment>", `{\n        vec2 grassUV = vWaterWorldPos.xz * 0.35;\n        vec3 grassColor = texture2D(uGrassMap, grassUV).rgb;\n        gl_FragColor.rgb = mix(gl_FragColor.rgb, grassColor, vShoreMix);\n\n        float farDist = length(vWaterWorldPos.xz);\n        float farMix = smoothstep(55.0, 95.0, farDist);\n        vec3 farColor = vec3(0.027, 0.031, 0.039);\n        gl_FragColor.rgb = mix(gl_FragColor.rgb, farColor, farMix);\n      }\n      #include <dithering_fragment>`);
  waterShaderRef = shader;
};

const water = new THREE.Mesh(waterGeo, waterMat);

water.position.y = -.02;

scene.add(water);

function makeGlintTexture() {
  const w = 64, h = 512;
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, w, 0);
  grad.addColorStop(0, "rgba(205,214,216,0)");
  grad.addColorStop(.5, "rgba(205,214,216,0.9)");
  grad.addColorStop(1, "rgba(205,214,216,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const glintDir = new THREE.Vector2(moonLight.position.x, moonLight.position.z).normalize();

const glintAngle = Math.atan2(glintDir.x, glintDir.y);

const glintLength = 90;

const glint = new THREE.Mesh(new THREE.PlaneGeometry(4.5, glintLength), new THREE.MeshBasicMaterial({
  map: makeGlintTexture(),
  transparent: true,
  opacity: .22,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: false
}));

glint.rotation.x = -Math.PI / 2;

glint.rotation.z = -glintAngle;

glint.position.set(glintDir.x * (glintLength / 2 - 8), -.015, glintDir.y * (glintLength / 2 - 8));

scene.add(glint);

function makeMistTexture() {
  const size = 256;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, size, size);
  const blobCount = 14;
  for (let i = 0; i < blobCount; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const r = size * (.18 + Math.random() * .22);
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, "rgba(230,235,232,0.5)");
    grad.addColorStop(1, "rgba(230,235,232,0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 4);
  return tex;
}

const mistLayers = [];

const mistHeights = [ .08, .22, .38 ];

for (let i = 0; i < mistHeights.length; i++) {
  const tex = makeMistTexture();
  const mist = new THREE.Mesh(new THREE.PlaneGeometry(CONFIG.waterSize * .9, CONFIG.waterSize * .9), new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    opacity: .09,
    depthWrite: false,
    fog: false
  }));
  mist.rotation.x = -Math.PI / 2;
  mist.position.y = mistHeights[i];
  scene.add(mist);
  mistLayers.push({
    mesh: mist,
    tex: tex,
    speed: .004 + i * .002
  });
}

function makeWoodGrainTexture(baseHex, seed) {
  const w = 512, h = 128;
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  const base = new THREE.Color(baseHex);
  const toRGB = c => `rgb(${Math.round(c.r * 255)}, ${Math.round(c.g * 255)}, ${Math.round(c.b * 255)})`;
  ctx.fillStyle = toRGB(base);
  ctx.fillRect(0, 0, w, h);
  const streakCount = 90;
  for (let i = 0; i < streakCount; i++) {
    const y = Math.random() * h;
    const lightness = (Math.random() - .5) * .16;
    const streakColor = base.clone().offsetHSL(0, (Math.random() - .5) * .02, lightness);
    ctx.strokeStyle = toRGB(streakColor);
    ctx.globalAlpha = .15 + Math.random() * .25;
    ctx.lineWidth = .6 + Math.random() * 1.8;
    ctx.beginPath();
    let x = 0;
    let yy = y;
    ctx.moveTo(x, yy);
    while (x < w) {
      x += 18 + Math.random() * 30;
      yy += (Math.random() - .5) * 6;
      ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const knotCount = 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < knotCount; i++) {
    const kx = Math.random() * w;
    const ky = Math.random() * h;
    const kr = 4 + Math.random() * 6;
    const knotColor = base.clone().offsetHSL(0, .05, -.22);
    const grad = ctx.createRadialGradient(kx, ky, 0, kx, ky, kr * 2.2);
    grad.addColorStop(0, toRGB(knotColor));
    grad.addColorStop(.5, toRGB(base.clone().offsetHSL(0, 0, -.1)));
    grad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(kx, ky, kr * 2.2, kr, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  const imgData = ctx.getImageData(0, 0, w, h);
  for (let p = 0; p < imgData.data.length; p += 4) {
    const n = (Math.random() - .5) * 14;
    imgData.data[p] = Math.min(255, Math.max(0, imgData.data[p] + n));
    imgData.data[p + 1] = Math.min(255, Math.max(0, imgData.data[p + 1] + n));
    imgData.data[p + 2] = Math.min(255, Math.max(0, imgData.data[p + 2] + n));
  }
  ctx.putImageData(imgData, 0, 0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const plankBaseColor = 5916208;

const WOOD_TEXTURE_VARIANTS = 4;

const woodTextures = [];

for (let i = 0; i < WOOD_TEXTURE_VARIANTS; i++) {
  woodTextures.push(makeWoodGrainTexture(plankBaseColor, i));
}

const plankLength = CONFIG.plankDepth + CONFIG.plankGap;

const plankCount = Math.ceil(CONFIG.pathLength / plankLength);

const pathGroup = new THREE.Group;

for (let i = 0; i < plankCount; i++) {
  const plankMat = new THREE.MeshStandardMaterial({
    map: woodTextures[i % WOOD_TEXTURE_VARIANTS],
    roughness: .92,
    metalness: 0
  });
  const plank = new THREE.Mesh(new THREE.BoxGeometry(CONFIG.pathWidth, .06, CONFIG.plankDepth), plankMat);
  plank.position.set((Math.random() - .5) * .03, CONFIG.pathY + (Math.random() - .5) * .01, -i * plankLength);
  plank.rotation.y = (Math.random() - .5) * .02;
  pathGroup.add(plank);
}

scene.add(pathGroup);

const PARTICLE_COUNT = 100;

const PARTICLE_CEILING = 6.5;

const particleGeo = new THREE.BufferGeometry;

const particlePositions = new Float32Array(PARTICLE_COUNT * 3);

const particleSpeeds = new Float32Array(PARTICLE_COUNT);

const particleSway = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  const radius = Math.random() * CONFIG.boundsRadius;
  const angle = Math.random() * Math.PI * 2;
  particlePositions[i * 3 + 0] = Math.cos(angle) * radius;
  particlePositions[i * 3 + 1] = Math.random() * PARTICLE_CEILING;
  particlePositions[i * 3 + 2] = Math.sin(angle) * radius - CONFIG.screenDistance * .5;
  particleSpeeds[i] = .04 + Math.random() * .06;
  particleSway[i] = Math.random() * Math.PI * 2;
}

particleGeo.setAttribute("position", new THREE.BufferAttribute(particlePositions, 3));

const particleMat = new THREE.PointsMaterial({
  color: 13489880,
  size: .03,
  transparent: true,
  opacity: .14,
  depthWrite: false,
  sizeAttenuation: true
});

const particles = new THREE.Points(particleGeo, particleMat);

scene.add(particles);

const videoA = document.getElementById("video-a");

const videoB = document.getElementById("video-b");

const videos = [ videoA, videoB ];

const texA = new THREE.VideoTexture(videoA);

const texB = new THREE.VideoTexture(videoB);

texA.colorSpace = THREE.SRGBColorSpace;

texB.colorSpace = THREE.SRGBColorSpace;

videos.forEach(v => {
  v.addEventListener("loadeddata", () => {
    if (v.currentTime === 0) v.currentTime = .01;
  }, {
    once: true
  });
});

function makeGlowTexture(colorHex) {
  const size = 256;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  const color = new THREE.Color(colorHex);
  const r = Math.round(color.r * 255);
  const g = Math.round(color.g * 255);
  const b = Math.round(color.b * 255);
  const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.5)`);
  gradient.addColorStop(.4, `rgba(${r}, ${g}, ${b}, 0.22)`);
  gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeScreen(texture, videoEl, x, rotationY, glowColor, side) {
  const group = new THREE.Group;
  const glowTex = makeGlowTexture(glowColor);
  const haloSize = Math.max(CONFIG.screenWidth, CONFIG.screenHeight) * 1.9;
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(haloSize, haloSize), new THREE.MeshBasicMaterial({
    map: glowTex,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  }));
  halo.position.z = -.04;
  group.add(halo);
  const backing = new THREE.Mesh(new THREE.PlaneGeometry(CONFIG.screenWidth, CONFIG.screenHeight), new THREE.MeshBasicMaterial({
    color: 0
  }));
  backing.position.z = -.02;
  group.add(backing);
  const screenMat = new THREE.MeshBasicMaterial({
    map: texture,
    toneMapped: false
  });
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), screenMat);
  screen.scale.set(CONFIG.screenWidth, CONFIG.screenHeight, 1);
  group.add(screen);
  function fitToFootage() {
    if (!videoEl.videoWidth || !videoEl.videoHeight) return;
    const frameAspect = CONFIG.screenWidth / CONFIG.screenHeight;
    const footageAspect = videoEl.videoWidth / videoEl.videoHeight;
    let w, h;
    if (footageAspect > frameAspect) {
      w = CONFIG.screenWidth;
      h = w / footageAspect;
    } else {
      h = CONFIG.screenHeight;
      w = h * footageAspect;
    }
    screen.scale.set(w, h, 1);
    const leftoverX = CONFIG.screenWidth - w;
    if (leftoverX > .001 && side) {
      screen.position.x = side === "left" ? -leftoverX / 2 : leftoverX / 2;
    } else {
      screen.position.x = 0;
    }
  }
  videoEl.addEventListener("loadedmetadata", fitToFootage);
  if (videoEl.readyState >= 1) fitToFootage();
  const light = new THREE.PointLight(glowColor, 4, 16, 1.5);
  light.position.set(0, 0, 1.5);
  group.add(light);
  group.position.set(x, CONFIG.screenHeightAbove, -CONFIG.screenDistance);
  group.rotation.y = rotationY;
  scene.add(group);
  return group;
}

const screenA = makeScreen(texA, videoA, -CONFIG.screenSpread / 2, CONFIG.screenAngle, 4876914, "left");

const screenB = makeScreen(texB, videoB, CONFIG.screenSpread / 2, -CONFIG.screenAngle, 6968648, "right");

const controls = new PointerLockControls(camera, renderer.domElement);

const intro = document.getElementById("intro");

const hud = document.getElementById("hud");

const crosshair = document.getElementById("crosshair");

const playPrompt = document.getElementById("play-prompt");

const homeHint = document.getElementById("home-hint");

let entered = false;

let playing = false;

intro.addEventListener("click", () => {
  controls.lock();
});

document.querySelector(".credits-link").addEventListener("click", e => {
  e.stopPropagation();
});

controls.addEventListener("lock", () => {
  intro.classList.add("hidden");
  hud.classList.add("visible");
  crosshair.classList.add("visible");
  homeHint.classList.add("visible");
  entered = true;
  if (!playing) {
    playPrompt.classList.add("visible");
  }
});

controls.addEventListener("unlock", () => {
  intro.classList.remove("hidden");
  hud.classList.remove("visible");
  crosshair.classList.remove("visible");
  playPrompt.classList.remove("visible");
  homeHint.classList.remove("visible");
});

function waitUntilReady(video) {
  return new Promise(resolve => {
    if (video.readyState >= 3) resolve(); else video.addEventListener("canplay", () => resolve(), {
      once: true
    });
  });
}

async function playBoth() {
  playing = true;
  playPrompt.classList.add("fading");
  setTimeout(() => playPrompt.classList.remove("visible"), 800);
  videos.forEach(v => {
    v.currentTime = 0;
  });
  await Promise.all(videos.map(waitUntilReady));
  videos.forEach(v => {
    v.muted = false;
  });
  await Promise.all(videos.map(v => v.play().catch(() => {})));
  hud.textContent = "playing — click to stop, esc to release the view";
}

function pauseBoth() {
  videos.forEach(v => v.pause());
  hud.textContent = "stopped — click to play again, esc to release the view";
}

function toggleBoth() {
  if (!playing) {
    playBoth();
  } else if (videoA.paused) {
    videos.forEach(v => v.play().catch(() => {}));
    hud.textContent = "playing — click to stop, esc to release the view";
  } else {
    pauseBoth();
  }
}

renderer.domElement.addEventListener("mousedown", () => {
  if (entered) toggleBoth();
});

const move = {
  forward: false,
  back: false,
  left: false,
  right: false
};

window.addEventListener("keydown", e => {
  switch (e.code) {
   case "KeyW":
   case "ArrowUp":
    move.forward = true;
    break;

   case "KeyS":
   case "ArrowDown":
    move.back = true;
    break;

   case "KeyA":
   case "ArrowLeft":
    move.left = true;
    break;

   case "KeyD":
   case "ArrowRight":
    move.right = true;
    break;
  }
});

window.addEventListener("keyup", e => {
  switch (e.code) {
   case "KeyW":
   case "ArrowUp":
    move.forward = false;
    break;

   case "KeyS":
   case "ArrowDown":
    move.back = false;
    break;

   case "KeyA":
   case "ArrowLeft":
    move.left = false;
    break;

   case "KeyD":
   case "ArrowRight":
    move.right = false;
    break;
  }
});

const clock = new THREE.Clock;

function updateMovement(dt) {
  const dir = new THREE.Vector3(Number(move.right) - Number(move.left), 0, Number(move.back) - Number(move.forward));
  if (dir.lengthSq() > 0) dir.normalize();
  controls.moveRight(dir.x * CONFIG.walkSpeed * dt);
  controls.moveForward(-dir.z * CONFIG.walkSpeed * dt);
  const p = controls.getObject().position;
  const dist = Math.hypot(p.x, p.z);
  if (dist > CONFIG.boundsRadius) {
    const scale = CONFIG.boundsRadius / dist;
    p.x *= scale;
    p.z *= scale;
  }
  p.y = CONFIG.eyeHeight;
}

const START_POSITION = new THREE.Vector3(0, CONFIG.eyeHeight, 2.5);

function returnHome() {
  videos.forEach(v => {
    v.pause();
    v.currentTime = 0;
    v.muted = true;
  });
  playing = false;
  entered = false;
  hud.textContent = "walking — esc to release the view";
  camera.position.copy(START_POSITION);
  camera.rotation.set(0, 0, 0);
  if (document.exitPointerLock) document.exitPointerLock();
  controls.unlock();
}

window.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    if (entered) toggleBoth();
  }
  if (e.key === "r" || e.key === "R") {
    if (!playing) return;
    videos.forEach(v => {
      v.currentTime = 0;
    });
    videos.forEach(v => v.play().catch(() => {}));
    hud.textContent = "playing — click to stop, esc to release the view";
  }
  if (e.key === "h" || e.key === "H") {
    if (entered) returnHome();
  }
});

function animateParticles(t, dt) {
  const pos = particleGeo.attributes.position;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    let y = pos.getY(i) + particleSpeeds[i] * dt;
    if (y > PARTICLE_CEILING) y = 0;
    pos.setY(i, y);
    const baseX = particlePositions[i * 3 + 0];
    const baseZ = particlePositions[i * 3 + 2];
    const sway = Math.sin(t * .15 + particleSway[i]) * .15;
    pos.setX(i, baseX + sway);
    pos.setZ(i, baseZ + sway * .6);
  }
  pos.needsUpdate = true;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .1);
  const t = clock.elapsedTime;
  if (waterShaderRef) {
    waterShaderRef.uniforms.uTime.value = t;
  }
  glint.material.opacity = .16 + Math.sin(t * .5) * .04 + Math.sin(t * 1.7) * .02;
  mistLayers.forEach((layer, i) => {
    layer.tex.offset.x = t * layer.speed;
    layer.tex.offset.y = t * layer.speed * .6 * (i % 2 === 0 ? 1 : -1);
  });
  animateParticles(t, dt);
  if (controls.isLocked) {
    updateMovement(dt);
  }
  renderer.render(scene, camera);
}

animate();
</script>
