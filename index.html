<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seed Generator</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #030405;
    overflow: hidden;
    font-family: "Courier New", Courier, monospace;
  }
  canvas { display: block; }

  #intro {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #030405;
    color: #cdd6d8;
    text-align: center;
    cursor: pointer;
    transition: opacity 0.8s ease;
  }
  #intro.hidden { opacity: 0; pointer-events: none; }
  #intro h1 {
    font-weight: 400;
    font-size: 52px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 26px 0;
    color: #cdd6d8;
  }
  #intro p {
    font-size: 12px;
    letter-spacing: 0.12em;
    color: #cdd6d8;
    margin: 6px 0;
  }
  #intro .enter {
    margin-top: 26px;
    border: 1px solid #445052;
    padding: 14px 40px;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #cdd6d8;
  }

  #intro .credits-group {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #intro .credits-link {
    border: 1px solid #445052;
    padding: 14px 40px;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #cdd6d8;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.3s ease, border-color 0.3s ease;
  }
  #intro .credits-link:hover { color: #cdd6d8; border-color: #5c6a6d; }

  @media (max-width: 480px) {
    #intro h1 { font-size: 30px; letter-spacing: 0.06em; }
  }

  #hud {
    position: fixed;
    bottom: 18px;
    left: 18px;
    z-index: 10;
    color: #cdd6d8;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  #hud.visible { opacity: 0.6; }

  #crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 4px;
    margin: -2px 0 0 -2px;
    border-radius: 50%;
    background: rgba(205, 214, 216, 0.35);
    z-index: 10;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  #crosshair.visible { opacity: 1; }

  #play-prompt {
    position: fixed;
    bottom: 60px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
    color: #cdd6d8;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }
  #play-prompt.visible { opacity: 0.75; }
  #play-prompt.fading { opacity: 0; }

  #home-hint {
    position: fixed;
    bottom: 18px;
    right: 22px;
    z-index: 10;
    color: #cdd6d8;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  #home-hint.visible { opacity: 0.5; }
</style>
</head>
<body>

<div id="intro">
  <h1>Seed Generator</h1>
  <p>How can we grow better futures? A journey away from AI.</p>
  <p>WASD or arrow keys to walk &nbsp;·&nbsp; mouse to look &nbsp;·&nbsp; H to return home &nbsp;·&nbsp; Esc to release</p>
  <div class="enter">click to enter</div>
  <div class="credits-group">
    <a class="credits-link" href="credits.html">credits</a>
  </div>
</div>

<div id="hud">walking — esc to release the view</div>
<div id="crosshair"></div>
<div id="play-prompt">click to play both screens — sound on</div>
<div id="home-hint">press H to return home</div>

<!-- Hidden source video elements. Their frames are streamed onto the two
     hovering screens as textures. Replace the src files in /videos/ with
     your own exports; filenames below are the only thing that needs to match.
     They start muted and paused on their first frame (a static image) until
     the visitor clicks once inside the space — that click unmutes and plays
     both together. -->
<video id="video-a" src="https://www.dropbox.com/scl/fi/2czrni27arrmzc4o5dmhb/screen-a.webm?rlkey=o1ykgkgrtzeimchpfm6bh2elx&dl=1" loop muted playsinline preload="auto" crossorigin="anonymous" style="position:fixed; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none;"></video>
<video id="video-b" src="https://www.dropbox.com/scl/fi/um168g9r7ob4ioee28m8d/screen-b.webm?rlkey=7l444uq6urtgj1bwzadwt3e1f&dl=1" loop muted playsinline preload="auto" crossorigin="anonymous" style="position:fixed; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none;"></video>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";

/* ---------------------------------------------------------------------
   CONFIG — the numbers you're most likely to want to tweak live here.
--------------------------------------------------------------------- */
const CONFIG = {
  fogColor: 0x030405,
  fogDensity: 0.045,

  waterColor: 0x061018,
  waterSize: 200,
  waterSegments: 140,
  waveHeight: 0.06,
  waveSpeed: 0.35,

  pathLength: 9,        // short walk — just far enough to feel deliberate
  pathWidth: 1.4,
  plankDepth: 0.5,
  plankGap: 0.06,
  pathY: 0.02,           // boardwalk sits just above the water surface

  screenWidth: 10.8,
  screenHeight: 4.05,   // 24:9 — ultra-wide; footage will letterbox to fit
  screenDistance: 8,    // pulled back a bit more for the wider screens
  screenSpread: 6.6,
  screenHeightAbove: 3.0,
  screenAngle: Math.PI / 7.5,  // how sharply each screen turns away from the other

  eyeHeight: 1.65,
  walkSpeed: 3.4,
  boundsRadius: 18,      // soft edge of the walkable area
};

/* ---------------------------------------------------------------------
   RENDERER / SCENE / CAMERA
--------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(CONFIG.fogColor, CONFIG.fogDensity);
scene.background = new THREE.Color(CONFIG.fogColor);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, CONFIG.eyeHeight, 2.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------------------------------------------------------------------
   LIGHTING — dim, cool, atmospheric. The screens do most of the lighting.
--------------------------------------------------------------------- */
scene.add(new THREE.AmbientLight(0x1a2830, 0.9));

const moon = new THREE.DirectionalLight(0x3a4d55, 0.35);
moon.position.set(-8, 18, -6);
scene.add(moon);

/* ---------------------------------------------------------------------
   WATER — a displaced plane, gently animated, dark and half-reflective.
--------------------------------------------------------------------- */
const waterGeo = new THREE.PlaneGeometry(
  CONFIG.waterSize, CONFIG.waterSize, CONFIG.waterSegments, CONFIG.waterSegments
);
waterGeo.rotateX(-Math.PI / 2);
const waterPos = waterGeo.attributes.position;
const waterBase = new Float32Array(waterPos.count);
for (let i = 0; i < waterPos.count; i++) waterBase[i] = waterPos.getY(i);

const waterMat = new THREE.MeshStandardMaterial({
  color: CONFIG.waterColor,
  roughness: 0.25,
  metalness: 0.15,
  envMapIntensity: 0.6,
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.position.y = -0.02;
scene.add(water);

/* ---------------------------------------------------------------------
   BOARDWALK — short planks laid end to end along +Z, slightly uneven.
--------------------------------------------------------------------- */
const plankMat = new THREE.MeshStandardMaterial({
  color: 0x14100c,
  roughness: 0.85,
  metalness: 0.0,
});
const plankLength = CONFIG.plankDepth + CONFIG.plankGap;
const plankCount = Math.ceil(CONFIG.pathLength / plankLength);
const pathGroup = new THREE.Group();
for (let i = 0; i < plankCount; i++) {
  const plank = new THREE.Mesh(
    new THREE.BoxGeometry(CONFIG.pathWidth, 0.06, CONFIG.plankDepth),
    plankMat
  );
  plank.position.set(
    (Math.random() - 0.5) * 0.03,
    CONFIG.pathY + (Math.random() - 0.5) * 0.01,
    -i * plankLength
  );
  plank.rotation.y = (Math.random() - 0.5) * 0.02;
  pathGroup.add(plank);
}
scene.add(pathGroup);

// faint guiding line down the centre of the walkway
const guide = new THREE.Mesh(
  new THREE.PlaneGeometry(0.03, CONFIG.pathLength),
  new THREE.MeshBasicMaterial({ color: 0x3d5a5f, transparent: true, opacity: 0.35 })
);
guide.rotation.x = -Math.PI / 2;
guide.position.set(0, CONFIG.pathY + 0.035, -CONFIG.pathLength / 2);
scene.add(guide);

/* ---------------------------------------------------------------------
   PARTICLES — a very sparse field of drifting motes, for atmosphere.
   Slow, quiet, faintly luminous; not tied to the screens in any way.
--------------------------------------------------------------------- */
const PARTICLE_COUNT = 220;
const PARTICLE_CEILING = 6.5;
const particleGeo = new THREE.BufferGeometry();
const particlePositions = new Float32Array(PARTICLE_COUNT * 3);
const particleSpeeds = new Float32Array(PARTICLE_COUNT);
const particleSway = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  const radius = Math.random() * CONFIG.boundsRadius;
  const angle = Math.random() * Math.PI * 2;
  particlePositions[i * 3 + 0] = Math.cos(angle) * radius;
  particlePositions[i * 3 + 1] = Math.random() * PARTICLE_CEILING;
  particlePositions[i * 3 + 2] = Math.sin(angle) * radius - CONFIG.screenDistance * 0.5;
  particleSpeeds[i] = 0.04 + Math.random() * 0.06;
  particleSway[i] = Math.random() * Math.PI * 2;
}
particleGeo.setAttribute("position", new THREE.BufferAttribute(particlePositions, 3));

const particleMat = new THREE.PointsMaterial({
  color: 0xcdd6d8,
  size: 0.045,
  transparent: true,
  opacity: 0.28,
  depthWrite: false,
  sizeAttenuation: true,
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

/* ---------------------------------------------------------------------
   SCREENS — two video-textured planes, hovering, angled away from each
   other, positioned ahead and to either side of the walkway's end.
--------------------------------------------------------------------- */
const videoA = document.getElementById("video-a");
const videoB = document.getElementById("video-b");
const videos = [videoA, videoB];
const texA = new THREE.VideoTexture(videoA);
const texB = new THREE.VideoTexture(videoB);
texA.colorSpace = THREE.SRGBColorSpace;
texB.colorSpace = THREE.SRGBColorSpace;

// Force each video to display its first frame as a still image while
// paused, rather than sitting black until playback begins.
videos.forEach((v) => {
  v.addEventListener("loadeddata", () => {
    if (v.currentTime === 0) v.currentTime = 0.01;
  }, { once: true });
});

function makeScreen(texture, videoEl, x, rotationY, glowColor, side) {
  const group = new THREE.Group();

  // soft outer glow, slightly larger than the frame
  const glow = new THREE.Mesh(
    new THREE.PlaneGeometry(CONFIG.screenWidth + 0.14, CONFIG.screenHeight + 0.14),
    new THREE.MeshBasicMaterial({ color: glowColor, transparent: true, opacity: 0.18 })
  );
  glow.position.z = -0.03;
  group.add(glow);

  // solid black backing at the full frame size — this is what shows
  // through as letterbox/pillarbox space if the footage isn't the same
  // shape as the frame
  const backing = new THREE.Mesh(
    new THREE.PlaneGeometry(CONFIG.screenWidth, CONFIG.screenHeight),
    new THREE.MeshBasicMaterial({ color: 0x000000 })
  );
  backing.position.z = -0.02;
  group.add(backing);

  // the film itself: starts filling the frame, then rescales to match the
  // footage's real aspect ratio once its dimensions are known, so it's
  // undistorted. If the footage is narrower than the frame (pillarboxed),
  // it's pushed to this screen's outer edge — away from the other screen —
  // so the leftover black space collects in the middle, between the two.
  const screenMat = new THREE.MeshBasicMaterial({ map: texture, toneMapped: false });
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), screenMat);
  screen.scale.set(CONFIG.screenWidth, CONFIG.screenHeight, 1);
  group.add(screen);

  function fitToFootage() {
    if (!videoEl.videoWidth || !videoEl.videoHeight) return;
    const frameAspect = CONFIG.screenWidth / CONFIG.screenHeight;
    const footageAspect = videoEl.videoWidth / videoEl.videoHeight;
    let w, h;
    if (footageAspect > frameAspect) {
      w = CONFIG.screenWidth;
      h = w / footageAspect;
    } else {
      h = CONFIG.screenHeight;
      w = h * footageAspect;
    }
    screen.scale.set(w, h, 1);

    // horizontal leftover only exists when the footage is narrower than
    // the frame (pillarboxed) — shove it outward on that axis
    const leftoverX = CONFIG.screenWidth - w;
    if (leftoverX > 0.001 && side) {
      screen.position.x = side === "left" ? -leftoverX / 2 : leftoverX / 2;
    } else {
      screen.position.x = 0;
    }
  }
  videoEl.addEventListener("loadedmetadata", fitToFootage);
  if (videoEl.readyState >= 1) fitToFootage();

  const light = new THREE.PointLight(glowColor, 3.5, 12, 2);
  light.position.set(0, 0, 1.5);
  group.add(light);

  group.position.set(x, CONFIG.screenHeightAbove, -CONFIG.screenDistance);
  group.rotation.y = rotationY;
  scene.add(group);
  return group;
}

const screenA = makeScreen(texA, videoA, -CONFIG.screenSpread / 2, CONFIG.screenAngle, 0x4a6a72, "left");
const screenB = makeScreen(texB, videoB, CONFIG.screenSpread / 2, -CONFIG.screenAngle, 0x6a5548, "right");

/* ---------------------------------------------------------------------
   POINTER-LOCK WALKING CONTROLS
--------------------------------------------------------------------- */
const controls = new PointerLockControls(camera, renderer.domElement);
const intro = document.getElementById("intro");
const hud = document.getElementById("hud");
const crosshair = document.getElementById("crosshair");
const playPrompt = document.getElementById("play-prompt");
const homeHint = document.getElementById("home-hint");

let entered = false;   // has the visitor clicked past the intro
let playing = false;   // have the films been started yet

intro.addEventListener("click", () => {
  controls.lock();
});

document.querySelector(".credits-link").addEventListener("click", (e) => {
  e.stopPropagation();
});

controls.addEventListener("lock", () => {
  intro.classList.add("hidden");
  hud.classList.add("visible");
  crosshair.classList.add("visible");
  homeHint.classList.add("visible");
  entered = true;
  if (!playing) {
    playPrompt.classList.add("visible");
  }
});

controls.addEventListener("unlock", () => {
  intro.classList.remove("hidden");
  hud.classList.remove("visible");
  crosshair.classList.remove("visible");
  playPrompt.classList.remove("visible");
  homeHint.classList.remove("visible");
});

// One click anywhere inside the space (after entering) starts both films
// together, with sound. Clicking again pauses them; click once more to
// resume. Until the first click they sit on their first frame, static.
function waitUntilReady(video) {
  return new Promise((resolve) => {
    if (video.readyState >= 3) resolve();
    else video.addEventListener("canplay", () => resolve(), { once: true });
  });
}

async function playBoth() {
  playing = true;
  playPrompt.classList.add("fading");
  setTimeout(() => playPrompt.classList.remove("visible"), 800);

  videos.forEach((v) => { v.currentTime = 0; });
  await Promise.all(videos.map(waitUntilReady));
  videos.forEach((v) => { v.muted = false; });
  await Promise.all(videos.map((v) => v.play().catch(() => {})));

  hud.textContent = "playing — click to stop, esc to release the view";
}

function pauseBoth() {
  videos.forEach((v) => v.pause());
  hud.textContent = "stopped — click to play again, esc to release the view";
}

function toggleBoth() {
  if (!playing) {
    playBoth();
  } else if (videoA.paused) {
    videos.forEach((v) => v.play().catch(() => {}));
    hud.textContent = "playing — click to stop, esc to release the view";
  } else {
    pauseBoth();
  }
}

renderer.domElement.addEventListener("mousedown", () => {
  if (entered) toggleBoth();
});

const move = { forward: false, back: false, left: false, right: false };
window.addEventListener("keydown", (e) => {
  switch (e.code) {
    case "KeyW": case "ArrowUp": move.forward = true; break;
    case "KeyS": case "ArrowDown": move.back = true; break;
    case "KeyA": case "ArrowLeft": move.left = true; break;
    case "KeyD": case "ArrowRight": move.right = true; break;
  }
});
window.addEventListener("keyup", (e) => {
  switch (e.code) {
    case "KeyW": case "ArrowUp": move.forward = false; break;
    case "KeyS": case "ArrowDown": move.back = false; break;
    case "KeyA": case "ArrowLeft": move.left = false; break;
    case "KeyD": case "ArrowRight": move.right = false; break;
  }
});

const clock = new THREE.Clock();

// Direct, no-inertia movement: the view stops the instant a key is
// released, rather than gliding to a stop. Nothing about the framing
// drifts once you park — only your own key presses move the camera.
function updateMovement(dt) {
  const dir = new THREE.Vector3(
    Number(move.right) - Number(move.left),
    0,
    Number(move.back) - Number(move.forward)
  );
  if (dir.lengthSq() > 0) dir.normalize();

  controls.moveRight(dir.x * CONFIG.walkSpeed * dt);
  controls.moveForward(-dir.z * CONFIG.walkSpeed * dt);

  // keep the visitor within a soft circular bound around the scene
  const p = controls.getObject().position;
  const dist = Math.hypot(p.x, p.z);
  if (dist > CONFIG.boundsRadius) {
    const scale = CONFIG.boundsRadius / dist;
    p.x *= scale;
    p.z *= scale;
  }
  p.y = CONFIG.eyeHeight;
}

const START_POSITION = new THREE.Vector3(0, CONFIG.eyeHeight, 2.5);

// Fully resets the experience: stops and rewinds both films, puts the
// camera back at the entrance, and releases the pointer — the same state
// the piece is in before anyone has clicked "enter."
function returnHome() {
  videos.forEach((v) => {
    v.pause();
    v.currentTime = 0;
    v.muted = true;
  });
  playing = false;
  entered = false;
  hud.textContent = "walking — esc to release the view";

  camera.position.copy(START_POSITION);
  camera.rotation.set(0, 0, 0);

  if (document.exitPointerLock) document.exitPointerLock();
  controls.unlock();
}

// Space: same play/stop toggle as clicking. R: restart both from frame 0,
// in sync, keeping sound state. H: return to the entrance.
window.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    if (entered) toggleBoth();
  }
  if (e.key === "r" || e.key === "R") {
    if (!playing) return;
    videos.forEach((v) => { v.currentTime = 0; });
    videos.forEach((v) => v.play().catch(() => {}));
    hud.textContent = "playing — click to stop, esc to release the view";
  }
  if (e.key === "h" || e.key === "H") {
    if (entered) returnHome();
  }
});

/* ---------------------------------------------------------------------
   ANIMATE
--------------------------------------------------------------------- */
function animateWater(t) {
  for (let i = 0; i < waterPos.count; i++) {
    const x = waterPos.getX(i);
    const z = waterPos.getZ(i);
    const y = waterBase[i] +
      Math.sin(x * 0.35 + t * CONFIG.waveSpeed) * CONFIG.waveHeight +
      Math.cos(z * 0.28 + t * CONFIG.waveSpeed * 0.8) * CONFIG.waveHeight;
    waterPos.setY(i, y);
  }
  waterPos.needsUpdate = true;
  waterGeo.computeVertexNormals();
}

function animateParticles(t, dt) {
  const pos = particleGeo.attributes.position;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    let y = pos.getY(i) + particleSpeeds[i] * dt;
    if (y > PARTICLE_CEILING) y = 0;
    pos.setY(i, y);

    const baseX = particlePositions[i * 3 + 0];
    const baseZ = particlePositions[i * 3 + 2];
    const sway = Math.sin(t * 0.15 + particleSway[i]) * 0.15;
    pos.setX(i, baseX + sway);
    pos.setZ(i, baseZ + sway * 0.6);
  }
  pos.needsUpdate = true;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;

  animateWater(t);
  animateParticles(t, dt);

  if (controls.isLocked) {
    updateMovement(dt);
  }

  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
